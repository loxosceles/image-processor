services:
  api:
    container_name: image_processor_api
    image: ghcr.io/loxosceles/image_processor_api:${TAG}
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ${PWD}/images:/app/images
      - ${PWD}/processed:/app/processed
    environment:
      - INPUT_FOLDER=/app/images
      - OUTPUT_FOLDER=/app/processed
    restart: unless-stopped

  frontend:
    container_name: image_processor_frontend
    image: ghcr.io/loxosceles/image_processor_frontend:${TAG}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL}
    restart: unless-stopped
    depends_on:
      - api
